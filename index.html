<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABP/SIMPL | Your Assessment Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:#FAFAF8}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const C = {
  bg: "#FAFAF8", surface: "#FFFFFF", tint: "#F7F5F0", amber: "#9A7B2C",
  amberSub: "#FFF7E3", text: "#2D3039", text2: "#5A5E6B", border: "#E4E3DE",
  accent: "#C9A23D", green: "#2D6A4F", greenSub: "#E8F5E9",
};
const serif = "'Source Serif 4', Georgia, serif";
const sans = "'Source Sans 3', 'Segoe UI', sans-serif";

const SCALE = [
  { level: "1", title: "Supervisor Performed", color: "#E74C3C", short: "You observed", detail: "The supervisor performed the activity. You observed but were not yet ready to actively participate in leading the care." },
  { level: "2", title: "Supervisor Led", color: "#E67E22", short: "Supervisor directed most care", detail: "Required supervising physician(s) to direct the majority of the care. The supervisor led and you assisted or performed portions under close direction." },
  { level: "3", title: "Co-Led", color: "#F1C40F", short: "You and supervisor co-led", detail: "Required supervising physician(s) to direct some aspects of the care. You and your supervisor co-led, with the supervisor stepping in to guide specific elements." },
  { level: "4", title: "You Led", color: "#27AE60", short: "Only small adjustments needed", detail: "Resident directed care, supervision only led to small adjustments. You led the encounter and the supervisor's involvement was limited to minor refinements." },
  { level: "5", title: "Independent", color: "#2D6A4F", short: "Safe without a supervisor", detail: "Care would have been safe and effective without a supervisor. This does not mean you are done learning \u2014 it means for this encounter, you did not need someone overseeing the care." },
];

const CCC_SCALE = [
  { level: "1", title: "Observation Only", desc: "Supervisor performs. Trainee is not ready to actively participate." },
  { level: "2", title: "Supervisor Present", desc: "2A: Co-activity. 2B: Supervisor in room, ready to step in." },
  { level: "3", title: "Supervisor Available", desc: "3A: Close oversight. 3B: Moderate. Supervisor readily available but not always present." },
  { level: "4", title: "Limited Oversight", desc: "Supervisor still required but does not need to be readily available. NOT yet practice ready." },
  { level: "5", title: "Practice Ready", desc: "No supervisor required. Knows limits and seeks input when needed." },
];

/* ===== SMALL EXPANDABLE (for inside tiles) ===== */

function Exp({ title, children, open: defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  const ref = useRef(null);
  const [h, setH] = useState(0);
  useEffect(() => { if (ref.current) setH(ref.current.scrollHeight); }, [open, children]);
  return (
    <div style={{ marginBottom: 5 }}>
      <button onClick={e => { e.stopPropagation(); setOpen(!open); }} style={{ display: "flex", alignItems: "flex-start", gap: 10, width: "100%", border: "1px solid " + (open ? C.border : "transparent"), background: open ? C.surface : "transparent", borderRadius: 8, padding: "11px 13px", cursor: "pointer", textAlign: "left", transition: "all .2s" }}
        onMouseEnter={e => { if (!open) { e.currentTarget.style.background = C.tint; e.currentTarget.style.borderColor = C.border; } }}
        onMouseLeave={e => { if (!open) { e.currentTarget.style.background = open ? C.surface : "transparent"; e.currentTarget.style.borderColor = open ? C.border : "transparent"; } }}>
        <span style={{ color: C.amber, fontSize: 11, fontWeight: 700, flexShrink: 0, marginTop: 4, transition: "transform .2s", transform: open ? "rotate(90deg)" : "rotate(0)", display: "inline-block" }}>{"\u25B8"}</span>
        <span style={{ fontFamily: serif, fontSize: 15, fontWeight: 700, color: C.text, lineHeight: 1.45 }}>{title}</span>
      </button>
      <div style={{ maxHeight: open ? h + 20 : 0, overflow: "hidden", transition: "max-height .4s ease" }}>
        <div ref={ref} style={{ padding: "4px 13px 10px 36px", color: C.text2, fontFamily: sans, fontSize: 14.5, lineHeight: 1.75 }}>{children}</div>
      </div>
    </div>
  );
}

function Tip({ children, def }) {
  const [show, setShow] = useState(false);
  return (
    <span style={{ position: "relative", display: "inline" }}>
      <span onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)} onClick={e => { e.stopPropagation(); setShow(!show); }}
        style={{ color: C.amber, fontWeight: 600, borderBottom: "1.5px dotted " + C.accent, cursor: "help" }}>{children}</span>
      {show && <span style={{ position: "absolute", bottom: "calc(100% + 10px)", left: "50%", transform: "translateX(-50%)", background: C.text, color: "#F0F0EE", padding: "12px 16px", borderRadius: 10, fontSize: 14, lineHeight: 1.55, width: 310, zIndex: 100, boxShadow: "0 8px 30px rgba(0,0,0,.15)", fontFamily: sans, fontWeight: 400 }}>
        {def}<span style={{ position: "absolute", top: "100%", left: "50%", transform: "translateX(-50%)", borderLeft: "7px solid transparent", borderRight: "7px solid transparent", borderTop: "7px solid " + C.text }} />
      </span>}
    </span>
  );
}

function LinkBtn({ href, children }) {
  return <a href={href} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} style={{
    display: "inline-flex", alignItems: "center", gap: 6, background: C.amberSub, border: "1px solid " + C.accent,
    borderRadius: 8, padding: "8px 14px", fontFamily: sans, fontSize: 13.5, fontWeight: 600, color: C.amber,
    textDecoration: "none", margin: "4px 6px 4px 0", cursor: "pointer",
  }}>{children} <span style={{ fontSize: 10 }}>{"\u2197"}</span></a>;
}

function ExBox({ children }) {
  return <div style={{ background: C.tint, borderRadius: 8, padding: "13px 14px", border: "1px solid " + C.border, fontSize: 14, lineHeight: 1.65, color: C.text2, margin: "10px 0" }}>
    <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: ".12em", color: C.amber, fontWeight: 700, marginBottom: 5, fontFamily: sans }}>Example</div>
    {children}
  </div>;
}

/* ===== BIG EXPANDABLE TILE ===== */

function Tile({ icon, iconBg, title, summary, open: startOpen, children }) {
  const [open, setOpen] = useState(startOpen || false);
  const ref = useRef(null);
  const [h, setH] = useState(0);
  useEffect(() => { if (ref.current) setH(ref.current.scrollHeight); }, [open, children]);

  return (
    <div style={{ background: C.surface, border: "1px solid " + (open ? C.accent : C.border), borderRadius: 14, overflow: "hidden", transition: "all .2s", boxShadow: open ? "0 4px 20px rgba(0,0,0,.05)" : "none" }}>
      <div style={{ padding: "24px 24px 20px", cursor: "pointer" }} onClick={() => setOpen(!open)}>
        <div style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
          <div style={{ width: 50, height: 50, borderRadius: 13, background: iconBg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, flexShrink: 0 }}>{icon}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontFamily: serif, fontSize: 19, fontWeight: 700, color: C.text, marginBottom: 6, lineHeight: 1.3 }}>{title}</div>
            <div style={{ fontFamily: sans, fontSize: 15, color: C.text2, lineHeight: 1.65 }}>{summary}</div>
          </div>
          <div style={{ fontFamily: sans, fontSize: 18, color: C.amber, flexShrink: 0, marginTop: 2, transition: "transform .25s", transform: open ? "rotate(90deg)" : "rotate(0)" }}>{"\u25B8"}</div>
        </div>
      </div>
      <div style={{ maxHeight: open ? h + 20 : 0, overflow: "hidden", transition: "max-height .5s ease" }}>
        <div ref={ref} style={{ padding: "0 24px 24px 90px", borderTop: "1px solid " + C.border }}>
          <div style={{ paddingTop: 20 }}>{children}</div>
        </div>
      </div>
    </div>
  );
}

/* ===== APP ===== */

function App() {
  const [selLevel, setSelLevel] = useState(null);

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>

      {/* BANNER */}
      <div style={{ background: C.amberSub, borderBottom: "1px solid " + C.accent, padding: "10px 32px", textAlign: "center" }}>
        <p style={{ fontFamily: sans, fontSize: 13.5, color: C.amber, fontWeight: 600, lineHeight: 1.5, maxWidth: 700, margin: "0 auto" }}>{"\u2728"} This resource is a living document. We continue to update and improve it based on feedback.</p>
      </div>

      {/* HEADER */}
      <header style={{ background: C.surface, borderBottom: "1px solid " + C.border }}>
        <div style={{ maxWidth: 960, margin: "0 auto", padding: "40px 32px 28px", textAlign: "center" }}>
          <div style={{ display: "inline-block", fontSize: 11.5, letterSpacing: ".14em", textTransform: "uppercase", color: C.amber, fontFamily: sans, fontWeight: 700, background: C.amberSub, padding: "5px 16px", borderRadius: 20, marginBottom: 16 }}>ABP/SIMPL Assessment Platform</div>
          <h1 style={{ fontFamily: serif, fontSize: 34, fontWeight: 800, color: C.text, margin: "0 0 12px", lineHeight: 1.15 }}>Your Assessment Dashboard</h1>
          <p style={{ fontFamily: sans, fontSize: 17, color: C.text2, maxWidth: 580, margin: "0 auto 28px", lineHeight: 1.6 }}>A quick guide for pediatric residents</p>

          {/* QUICK LINKS */}
          <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap", margin: "0 auto 0" }}>
            <a href="#" style={{ display: "inline-flex", alignItems: "center", gap: 8, background: C.amberSub, border: "1.5px solid " + C.accent, borderRadius: 10, padding: "12px 20px", textDecoration: "none", fontFamily: sans, fontSize: 15, fontWeight: 600, color: C.amber }}>
              {"\u{1F3AC}"} Video Walkthrough <span style={{ fontSize: 11, opacity: .6 }}>(coming soon)</span>
            </a>
            <a href="#" style={{ display: "inline-flex", alignItems: "center", gap: 8, background: C.surface, border: "1.5px solid " + C.border, borderRadius: 10, padding: "12px 20px", textDecoration: "none", fontFamily: sans, fontSize: 15, fontWeight: 600, color: C.text }}>
              {"\u{1F4CA}"} Open Your Dashboard <span style={{ fontSize: 11, opacity: .6 }}>(link coming)</span>
            </a>
            <a href="#" style={{ display: "inline-flex", alignItems: "center", gap: 8, background: C.surface, border: "1.5px solid " + C.border, borderRadius: 10, padding: "12px 20px", textDecoration: "none", fontFamily: sans, fontSize: 15, fontWeight: 600, color: C.text }}>
              {"\u{1F4DD}"} Submit an Assessment <span style={{ fontSize: 11, opacity: .6 }}>(link coming)</span>
            </a>
          </div>
        </div>
      </header>

      {/* ===== CONTEXT + THREE TILES ===== */}
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "36px 32px 0" }}>

        {/* WHY — five goal cards */}
        <div style={{ fontFamily: sans, fontSize: 12, fontWeight: 700, color: C.amber, textTransform: "uppercase", letterSpacing: ".1em", marginBottom: 12 }}>Why this platform exists</div>
        <p style={{ fontFamily: sans, fontSize: 15, lineHeight: 1.7, color: C.text2, margin: "0 0 14px" }}>This assessment system is built around five goals. Tap any to learn more.</p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 10, marginBottom: 32 }}>
          {[
            { icon: "\u{2764}\u{FE0F}", t: "Center patients", d: "Ensure graduates can meet the needs of the children they serve. The required outcome of training is practice readiness \u2014 the ability to perform the essential activities of a general pediatrician safely and effectively." },
            { icon: "\u{1F393}", t: "Center learners", d: "Give you transparency, agency, and feedback that drives growth. This dashboard makes you a partner in tracking your own development. See the Growth tile below." },
            { icon: "\u{1F4C8}", t: "Improve the data", d: "Replace gestalt impressions with frequent, specific, observed evidence. Each encounter-based assessment captures what you actually did \u2014 not a vague recollection weeks later. See the Volume tile below." },
            { icon: "\u{2696}\u{FE0F}", t: "Improve equity", d: "Build structures that promote fairness and mitigate bias in assessment. If you\u2019re concerned a rating may reflect bias, bring it to your program \u2014 the system only works if concerns are surfaced." },
            { icon: "\u{1F504}", t: "Assessment & growth", d: "One system that serves both your learning and the decisions your program makes about your readiness. Your data supports your growth AND helps your program assess your progress. See the Progress tile below." },
          ].map((g, i) => {
            const [open, setOpen] = useState(false);
            return (
              <div key={i} onClick={() => setOpen(!open)} style={{ background: C.surface, border: "1px solid " + (open ? C.accent : C.border), borderRadius: 12, padding: "16px 14px", textAlign: "center", cursor: "pointer", transition: "all .2s" }}
                onMouseEnter={e => { if (!open) e.currentTarget.style.borderColor = C.accent; }}
                onMouseLeave={e => { if (!open) e.currentTarget.style.borderColor = C.border; }}>
                <div style={{ fontSize: 22, marginBottom: 6 }}>{g.icon}</div>
                <div style={{ fontFamily: serif, fontSize: 13, fontWeight: 700, color: C.text, lineHeight: 1.3, marginBottom: open ? 8 : 0 }}>{g.t}</div>
                {open && <div style={{ fontFamily: sans, fontSize: 12.5, color: C.text2, lineHeight: 1.6, textAlign: "left" }}>{g.d}</div>}
              </div>
            );
          })}
        </div>

        <div style={{ fontFamily: sans, fontSize: 12, fontWeight: 700, color: C.amber, textTransform: "uppercase", letterSpacing: ".1em", marginBottom: 14 }}>Your dashboard serves three purposes {"\u2014"} tap each to learn more</div>

        {/* THREE TILES */}
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

          {/* TILE 1: VOLUME */}
          <Tile icon={"\u{1F4CA}"} iconBg={C.amberSub}
            title="Track your assessment volume"
            summary="See how many assessments you have, how they're distributed across EPAs, and where you may have gaps \u2014 so you can ensure you're getting sufficient data for an accurate picture.">
            <Exp title="More data means a more accurate picture." open={true}>
              <p style={{ margin: 0 }}>We do not yet know how many assessments per EPA are needed to ensure your Clinical Competency Committee is making accurate and equitable decisions about your supervision needs. What we do know is that the more assessments you have, the more accurate the picture becomes. Each individual assessment is meant to be low-stakes, just one small piece of a much bigger puzzle. The system works best when there are many pieces.</p>
            </Exp>
            <Exp title="Initiating works, even when it feels like it doesn't.">
              <p style={{ margin: 0 }}>If your program uses a model where you push assessments to faculty, the data show that the more you initiate, the more assessments you receive. More pushes also mean more that go uncompleted. Try not to let that discourage you. The completed ones still add up.</p>
            </Exp>
            <Exp title="Faculty are learning too.">
              <p style={{ margin: 0 }}>If faculty aren't completing assessments or aren't initiating them as expected, know that this is a learning curve for everyone. Faculty are figuring out new tools and workflows at the same time you are. We're all learning this system together, and it gets easier with time.</p>
            </Exp>
          </Tile>

          {/* TILE 2: GROWTH */}
          <Tile icon={"\u{1F331}"} iconBg={C.greenSub}
            title="Promote your growth toward practice readiness"
            summary="Your supervision trends and narrative comments give you actionable feedback. Use them to identify strengths, notice growth areas, and build learning goals with your faculty coach.">
            <Exp title="Look for patterns, not snapshots." open={true}>
              <p style={{ margin: "0 0 10px" }}>The graphs show you patterns over time. Look for growth, and also notice periods where growth may have plateaued or dropped.</p>
              <p style={{ margin: "0 0 10px" }}><strong>Normal growth is not always linear</strong> {"\u2014"} we have good days and days that aren't our best. Dips and plateaus should be expected and provide an opportunity for reflection.</p>
              <p style={{ margin: 0 }}>If you see a plateau or dip, ask yourself: Do the narrative comments help me understand what I could work on? Can I use that to build an action plan?</p>
            </Exp>
            <Exp title="Your narrative comments are your richest source of feedback." open={true}>
              <p style={{ margin: "0 0 10px" }}>Developmental feedback isn't always obvious {"\u2014"} it frequently lacks a label like "area for improvement." It's often normal growth.</p>
              <ExBox>
                <span>A faculty member might write: <em style={{ color: C.text }}>"Managed the acute visit well and chose the right antibiotic, but could strengthen discharge counseling by checking back with the family."</em></span>
                <div style={{ marginTop: 8, fontWeight: 600, color: C.text }}>That's not a problem {"\u2014"} that's a growth opportunity inside a strong assessment.</div>
              </ExBox>
              <p style={{ margin: "0 0 10px" }}>Look <strong>across your comments over time</strong>. Are multiple faculty noting the same area? Is something that used to come up no longer appearing? Are expectations getting harder {"\u2014"} a sign you're being trusted with more?</p>
              <p style={{ margin: 0 }}>Use these patterns with your faculty coach to set concrete learning goals.</p>
            </Exp>
            <Exp title="Don't rely on averages.">
              <p style={{ margin: 0 }}>Each supervision rating reflects one judgment about one past encounter. Ratings, narrative comments, clinical context, and patterns over time should all be interpreted together. No single number tells the story.</p>
            </Exp>
            <Exp title="Not sure what to do with a comment?">
              <p style={{ margin: 0 }}>That's okay {"\u2014"} bring it to your faculty coach or a trusted mentor. They can help you interpret the feedback in context.</p>
            </Exp>
            <Exp title="Worried a rating may reflect bias?">
              <p style={{ margin: 0 }}>That concern is valid and important. Bring it to a trusted member of your program. One of the goals of this system is to improve equity {"\u2014"} and that only works if concerns are surfaced.</p>
            </Exp>
            <Exp title="Faculty are still learning the scales.">
              <p style={{ margin: 0 }}>Their numerical ratings may not always align with the narrative. With more assessments, individual inconsistencies matter less and the overall pattern becomes clearer.</p>
            </Exp>
          </Tile>

          {/* TILE 3: PROGRESS */}
          <Tile icon={"\u{1F9ED}"} iconBg="#EDE8F5"
            title="Help you and your program assess where you are"
            summary="The same data helps you and your program accurately understand where you are on your trajectory toward performing the activities of a general pediatrician without supervision at the time of graduation.">
            <p style={{ fontFamily: sans, fontSize: 14.5, lineHeight: 1.75, color: C.text2, margin: "0 0 14px" }}>Your <Tip def="A group of faculty and educators responsible for monitoring your progress and making decisions about your supervision needs across all EPAs.">Clinical Competency Committee (CCC)</Tip> reviews your aggregate data: supervision ratings, narrative comments, clinical context, and patterns over time. The approach described in this guide {"\u2014"} patterns over snapshots, narratives alongside ratings {"\u2014"} is the same approach your program and CCC should be using.</p>
            <Exp title="No single data point carries too much weight.">
              <p style={{ margin: 0 }}>With many data points from diverse faculty across settings and time, no single assessment should significantly influence a CCC determination.</p>
            </Exp>
            <Exp title="Preparing for 2028">
              <p style={{ margin: "0 0 10px" }}>Beginning in 2028, the ABP will require program directors to attest that graduates are practice ready across all EPAs as a prerequisite for initial certification.</p>
              <p style={{ margin: 0 }}>Current EPA assignments are developmental and are <strong>not reported to the ABP</strong>. They are intended to provide you with data to support your growth and to give your program more specific information to make decisions about your progress {"\u2014"} which will become consequential in 2028.</p>
            </Exp>
            <Exp title="This gets easier.">
              <p style={{ margin: "0 0 8px" }}>Programs that have used this system for more than a year consistently report it gets meaningfully easier. Technical issues resolve, faculty get comfortable, the data becomes richer. The first few months are the hardest.</p>
              <p style={{ margin: 0 }}>We are constantly improving based on feedback. If you find the system valuable, saying so matters.</p>
            </Exp>
          </Tile>
        </div>
      </div>

      {/* FOOTER */}
      <div style={{ background: C.surface, borderTop: "1px solid " + C.border, marginTop: 36 }}>
        <div style={{ maxWidth: 960, margin: "0 auto", padding: "28px 32px" }}>
          <div style={{ fontFamily: sans, fontSize: 12, fontWeight: 700, color: C.amber, textTransform: "uppercase", letterSpacing: ".1em", marginBottom: 16 }}>Questions or Concerns?</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
            <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
              <div style={{ width: 34, height: 34, borderRadius: 9, background: C.tint, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontSize: 16 }}>{"\u{1F91D}"}</div>
              <div>
                <div style={{ fontFamily: serif, fontWeight: 700, fontSize: 15, color: C.text, marginBottom: 3 }}>Concerns about your assessments?</div>
                <div style={{ fontFamily: sans, fontSize: 14, color: C.text2, lineHeight: 1.6 }}>Reach out to a trusted member of your program.</div>
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
              <div style={{ width: 34, height: 34, borderRadius: 9, background: C.tint, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontSize: 16 }}>{"\u{1F4A1}"}</div>
              <div>
                <div style={{ fontFamily: serif, fontWeight: 700, fontSize: 15, color: C.text, marginBottom: 3 }}>Platform or dashboard questions?</div>
                <div style={{ fontFamily: sans, fontSize: 14, color: C.text2, lineHeight: 1.6 }}>Reach out to the SIMPL team at <strong style={{ color: C.amber }}>[simpl-support@email.com]</strong></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(App));
} catch(e) { document.getElementById("root").innerHTML = "<pre style=\"color:red\">" + e.message + "\n" + e.stack + "</pre>"; }
</script>
</body>
</html>
