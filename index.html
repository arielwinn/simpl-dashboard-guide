<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABP/SIMPL | Your Assessment Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:#FAFAF8}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const C = {
  bg: "#FAFAF8", surface: "#FFFFFF", tint: "#F7F5F0", amber: "#9A7B2C",
  amberSub: "#FFF7E3", text: "#2D3039", text2: "#5A5E6B", border: "#E4E3DE",
  accent: "#C9A23D", green: "#2D6A4F", greenSub: "#E8F5E9",
};
const serif = "'Source Serif 4', Georgia, serif";
const sans = "'Source Sans 3', 'Segoe UI', sans-serif";

const SCALE = [
  { level: "1", title: "Supervisor Performed", color: "#E74C3C", short: "You observed", detail: "The supervisor performed the activity. You observed but were not yet ready to actively participate in leading the care." },
  { level: "2", title: "Supervisor Led", color: "#E67E22", short: "Supervisor directed most care", detail: "Required supervising physician(s) to direct the majority of the care. The supervisor led and you assisted or performed portions under close direction." },
  { level: "3", title: "Co-Led", color: "#F1C40F", short: "You and supervisor co-led", detail: "Required supervising physician(s) to direct some aspects of the care. You and your supervisor co-led, with the supervisor stepping in to guide specific elements." },
  { level: "4", title: "You Led", color: "#27AE60", short: "Only small adjustments needed", detail: "Resident directed care, supervision only led to small adjustments. You led the encounter and the supervisor's involvement was limited to minor refinements." },
  { level: "5", title: "Independent", color: "#2D6A4F", short: "Safe without a supervisor", detail: "Care would have been safe and effective without a supervisor. This does not mean you are done learning \u2014 it means for this encounter, you did not need someone overseeing the care." },
];

const CCC_SCALE = [
  { level: "1", title: "Observation Only", desc: "Supervisor performs. Trainee is not ready to actively participate." },
  { level: "2", title: "Supervisor Present", desc: "2A: Co-activity. 2B: Supervisor in room, ready to step in." },
  { level: "3", title: "Supervisor Available", desc: "3A: Close oversight. 3B: Moderate. Supervisor readily available but not always present." },
  { level: "4", title: "Limited Oversight", desc: "Supervisor still required but does not need to be readily available. NOT yet practice ready." },
  { level: "5", title: "Practice Ready", desc: "No supervisor required. Knows limits and seeks input when needed." },
];

/* ===== SMALL EXPANDABLE (for inside tiles) ===== */

function Exp({ title, children, open: defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div style={{ marginBottom: 5 }}>
      <button onClick={e => { e.stopPropagation(); setOpen(!open); }} style={{ display: "flex", alignItems: "flex-start", gap: 10, width: "100%", border: "1px solid " + (open ? C.border : "transparent"), background: open ? C.surface : "transparent", borderRadius: 8, padding: "11px 13px", cursor: "pointer", textAlign: "left", transition: "all .2s" }}
        onMouseEnter={e => { if (!open) { e.currentTarget.style.background = C.tint; e.currentTarget.style.borderColor = C.border; } }}
        onMouseLeave={e => { if (!open) { e.currentTarget.style.background = open ? C.surface : "transparent"; e.currentTarget.style.borderColor = open ? C.border : "transparent"; } }}>
        <span style={{ color: C.amber, fontSize: 11, fontWeight: 700, flexShrink: 0, marginTop: 4, transition: "transform .2s", transform: open ? "rotate(90deg)" : "rotate(0)", display: "inline-block" }}>{"\u25B8"}</span>
        <span style={{ fontFamily: serif, fontSize: 15, fontWeight: 700, color: C.text, lineHeight: 1.45 }}>{title}</span>
      </button>
      {open && <div style={{ padding: "4px 13px 10px 36px", color: C.text2, fontFamily: sans, fontSize: 14.5, lineHeight: 1.75 }}>{children}</div>}
    </div>
  );
}

function Tip({ children, def }) {
  const [show, setShow] = useState(false);
  return (
    <span style={{ position: "relative", display: "inline" }}>
      <span onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)} onClick={e => { e.stopPropagation(); setShow(!show); }}
        style={{ color: C.amber, fontWeight: 600, borderBottom: "1.5px dotted " + C.accent, cursor: "help" }}>{children}</span>
      {show && <span style={{ position: "absolute", bottom: "calc(100% + 10px)", left: "50%", transform: "translateX(-50%)", background: C.text, color: "#F0F0EE", padding: "12px 16px", borderRadius: 10, fontSize: 14, lineHeight: 1.55, width: 310, zIndex: 100, boxShadow: "0 8px 30px rgba(0,0,0,.15)", fontFamily: sans, fontWeight: 400 }}>
        {def}<span style={{ position: "absolute", top: "100%", left: "50%", transform: "translateX(-50%)", borderLeft: "7px solid transparent", borderRight: "7px solid transparent", borderTop: "7px solid " + C.text }} />
      </span>}
    </span>
  );
}

function LinkBtn({ href, children }) {
  return <a href={href} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} style={{
    display: "inline-flex", alignItems: "center", gap: 6, background: C.amberSub, border: "1px solid " + C.accent,
    borderRadius: 8, padding: "8px 14px", fontFamily: sans, fontSize: 13.5, fontWeight: 600, color: C.amber,
    textDecoration: "none", margin: "4px 6px 4px 0", cursor: "pointer",
  }}>{children} <span style={{ fontSize: 10 }}>{"\u2197"}</span></a>;
}

function ExBox({ children }) {
  return <div style={{ background: C.tint, borderRadius: 8, padding: "13px 14px", border: "1px solid " + C.border, fontSize: 14, lineHeight: 1.65, color: C.text2, margin: "10px 0" }}>
    <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: ".12em", color: C.amber, fontWeight: 700, marginBottom: 5, fontFamily: sans }}>Example</div>
    {children}
  </div>;
}

/* ===== BIG EXPANDABLE TILE ===== */

function Tile({ icon, iconBg, title, summary, open: startOpen, children, bg, topics }) {
  const [open, setOpen] = useState(startOpen || false);

  return (
    <div style={{ background: bg || C.surface, border: "1px solid " + (open ? C.accent : C.border), borderRadius: 14, transition: "border-color .2s, box-shadow .2s", boxShadow: open ? "0 4px 20px rgba(0,0,0,.05)" : "none" }}>
      <div style={{ padding: "14px 18px 12px", cursor: "pointer" }} onClick={() => setOpen(!open)}>
        <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
          <div style={{ width: 40, height: 40, borderRadius: 10, background: iconBg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>{icon}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontFamily: serif, fontSize: 17, fontWeight: 700, color: C.text, marginBottom: 3, lineHeight: 1.3 }}>{title}</div>
            <div style={{ fontFamily: sans, fontSize: 13.5, color: C.text2, lineHeight: 1.55 }}>{summary}</div>
            {!open && topics && topics.length > 0 && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
                {topics.map((t, i) => (
                  <span key={i} style={{ fontFamily: sans, fontSize: 11.5, color: C.text2, background: C.tint, border: "1px solid " + C.border, borderRadius: 20, padding: "3px 10px", lineHeight: 1.3 }}>{t}</span>
                ))}
              </div>
            )}
          </div>
          <div style={{ fontFamily: sans, fontSize: 18, color: C.amber, flexShrink: 0, marginTop: 2, transition: "transform .25s", transform: open ? "rotate(90deg)" : "rotate(0)" }}>{"\u25B8"}</div>
        </div>
      </div>
      {open && <div style={{ padding: "0 18px 18px 70px", borderTop: "1px solid " + C.border }}>
        <div style={{ paddingTop: 14 }}>{children}</div>
      </div>}
    </div>
  );
}

/* ===== APP ===== */

function App() {
  const [selLevel, setSelLevel] = useState(null);

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>

      {/* LIVING DOC BANNER */}
      <div style={{ background: C.amberSub, borderBottom: "1px solid " + C.accent, padding: "6px 32px", textAlign: "center" }}>
        <p style={{ fontFamily: sans, fontSize: 12.5, color: C.amber, fontWeight: 600, lineHeight: 1.4, maxWidth: 700, margin: "0 auto" }}>This resource is a living document. We continue to update and improve it based on feedback.</p>
      </div>

      {/* HEADER */}
      <header style={{ background: C.surface, borderBottom: "1px solid " + C.border }}>
        <div style={{ maxWidth: 960, margin: "0 auto", padding: "20px 32px 16px", textAlign: "center" }}>
          <h1 style={{ fontFamily: serif, fontSize: 28, fontWeight: 800, color: C.text, margin: "0 0 4px", lineHeight: 1.2 }}>A Guide to Using Your Assessment Dashboard</h1>
          <p style={{ fontFamily: sans, fontSize: 14, color: C.text2, margin: 0, lineHeight: 1.5 }}>ABP/SIMPL Assessment Platform</p>

          {/* QUICK LINKS */}
          <div style={{ display: "flex", gap: 10, justifyContent: "center", margin: "0 auto 0" }}>
            <a href="#" style={{ display: "inline-flex", alignItems: "center", gap: 6, background: C.amberSub, border: "1.5px solid " + C.accent, borderRadius: 10, padding: "10px 14px", textDecoration: "none", fontFamily: sans, fontSize: 13.5, fontWeight: 600, color: C.amber, textAlign: "center", lineHeight: 1.3 }}>
              {"\u{1F3AC}"} Video on How to Navigate the Dashboard <span style={{ fontSize: 10.5, opacity: .6 }}>(coming soon)</span>
            </a>
            <a href="#" style={{ display: "inline-flex", alignItems: "center", gap: 6, background: C.surface, border: "1.5px solid " + C.border, borderRadius: 10, padding: "10px 14px", textDecoration: "none", fontFamily: sans, fontSize: 13.5, fontWeight: 600, color: C.text, textAlign: "center", lineHeight: 1.3 }}>
              {"\u{1F4CA}"} Open Your Dashboard <span style={{ fontSize: 10.5, opacity: .6 }}>(link coming)</span>
            </a>
            <a href="https://platform.simpl.org/" target="_blank" rel="noopener" style={{ display: "inline-flex", alignItems: "center", gap: 6, background: C.surface, border: "1.5px solid " + C.border, borderRadius: 10, padding: "10px 14px", textDecoration: "none", fontFamily: sans, fontSize: 13.5, fontWeight: 600, color: C.text, textAlign: "center", lineHeight: 1.3 }}>
              {"\u{1F4DD}"} Create a Web Assessment
            </a>
          </div>
        </div>
      </header>

      {/* ===== CONTEXT + THREE TILES ===== */}
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "16px 32px 0" }}>

        {/* PLATFORM PURPOSE */}
        <div style={{ background: C.surface, border: "1px solid " + C.border, borderRadius: 14, padding: "18px 28px", marginBottom: 16 }}>
          <p style={{ fontFamily: serif, fontSize: 16, fontWeight: 700, color: C.text, lineHeight: 1.55, textAlign: "center", margin: "0 0 10px" }}>
            This platform and dashboard are built to ensure that at the time of graduation and certification, you are <em style={{ color: C.amber }}>practice ready</em>, able to provide safe and effective care as a general pediatrician.
          </p>
          <Exp title="What does practice ready mean?">
            <p style={{ margin: "0 0 14px", color: C.text2 }}>Pediatric residency prepares you to perform the essential activities of a general pediatrician (things like providing well-child care, managing acute illness, recognizing a severely ill child) safely and effectively in general pediatrics practice settings without someone assigned to direct or oversee your work. These essential activities are defined as Entrustable Professional Activities (EPAs), and the standard of being able to perform them at this level is what we call <em>practice ready</em>.</p>
            <p style={{ margin: "0 0 14px", color: C.text }}><strong>The required outcome of training for graduation and to be eligible to become board certified is to be practice ready across all of the General Pediatrics EPAs.</strong></p>
            <p style={{ margin: "0 0 14px", color: C.text }}><strong>Practice ready does not mean expert, and it does not mean complete independence.</strong> <span style={{ color: C.text2 }}>Pediatrics is inherently collaborative, and every practicing pediatrician works within systems of consultation, referral, and team-based care. Practice ready means you can be trusted to perform these essential activities (i.e. the EPAs) without someone assigned to direct or oversee your work, not that you practice without ever needing input or support.</span></p>
            <p style={{ margin: "0 0 14px", color: C.text }}><strong>You are not expected to be practice ready on day one of residency.</strong> <span style={{ color: C.text2 }}>It takes time to develop the skills and get the exposure needed to perform these activities. That is the point of training. Practice ready is a foundation, not a ceiling, that you may advance beyond for some EPAs during training.</span></p>
            <p style={{ margin: 0, color: C.text }}><strong>The standard is the same for everyone.</strong> <span style={{ color: C.text2 }}>It does not change based on future job plans or plans to pursue fellowship. Readiness to be a general pediatrician is foundational for every pediatrician regardless of career path.</span></p>
          </Exp>
        </div>

        <div style={{ fontFamily: sans, fontSize: 11.5, fontWeight: 700, color: C.amber, textTransform: "uppercase", letterSpacing: ".1em", marginBottom: 10 }}>Your dashboard serves three purposes {"\u2014"} tap each to learn more</div>

        {/* THREE TILES */}
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>

          {/* TILE 1: VOLUME */}
          <Tile icon={"\u{1F4CA}"} iconBg={C.amberSub}
            title="Track your assessment volume"
            summary="See how many assessments you have, how they're distributed across EPAs, and where you may have gaps — so you can ensure you're getting sufficient data for an accurate picture."
            topics={["More data = more accuracy", "Initiating works", "Faculty are learning too", "Coming soon: incomplete tracking"]}>
            <Exp title="More data means a more accurate picture." open={false}>
              <p style={{ margin: 0 }}>We do not yet know how many assessments per EPA are needed to ensure your Clinical Competency Committee is making accurate and equitable decisions about your supervision needs. What we do know is that the more assessments you have, the more accurate the picture becomes. Each individual assessment is meant to be low-stakes, just one small piece of a much bigger puzzle. The system works best when there are many pieces.</p>
            </Exp>
            <Exp title="Initiating works, even when it feels like it doesn't.">
              <p style={{ margin: 0 }}>If your program uses a model where you push assessments to faculty, the data show that the more you initiate, the more assessments you receive. More pushes also mean more that go uncompleted. Try not to let that discourage you. The completed ones still add up.</p>
            </Exp>
            <Exp title="Faculty are learning too.">
              <p style={{ margin: 0 }}>If faculty aren't completing or initiating assessments as expected, know that this is a learning curve for everyone. Faculty are figuring out new tools and workflows at the same time you are. We're all learning this system together, and it gets easier with time. Please reach out to a member of your program with specific concerns to see how they can help ensure your assessments are completed.</p>
            </Exp>
            <Exp title="Coming soon: Incomplete assessment tracking.">
              <p style={{ margin: 0 }}>We are actively developing visibility into your incomplete assessments (assessments that were initiated but not yet completed by faculty). This will allow you to track which assessments have been sent to faculty and which are still outstanding, giving you a fuller picture of your assessment activity and helping you follow up when needed.</p>
            </Exp>
          </Tile>

          {/* TILE 2: GROWTH */}
          <Tile icon={"\u{1F331}"} iconBg={C.greenSub}
            title="Promote your growth toward practice readiness"
            summary="Your narrative comments are your richest source of feedback. These are where you'll find both areas of strength and areas where you can focus to take your performance to the next level."
            topics={["Build learning plans", "Hidden feedback", "Unhelpful comments", "Dictation artifacts", "Bias concerns", "Frequent feedback"]}>
            <Exp title="Use your narratives to build learning and growth plans.">
              <p style={{ margin: 0 }}>The narrative comments within your EPA-based forms and narrative-only forms are not just feedback to read once and move on from. They are the raw material for your learning and growth plans. At the level of an individual assessment, a comment can point you toward something specific to work on in your next encounter. But the real power comes from looking across your comments over time and noticing patterns: are multiple faculty noting the same area for growth? Is something that used to come up no longer appearing? Are there themes in what you do well that you can build on?</p>
            </Exp>
            <Exp title='Make sure not to miss "hidden" feedback.'>
              <p style={{ margin: "0 0 10px" }}>In this type of assessment system, developmental feedback isn't always obvious, as it frequently lacks a label of "area for improvement" or "deficiency." And that makes sense, because most often an area for growth does not represent a deficiency but rather expected development in training.</p>
              <ExBox>
                <span>For example, a faculty member might write that you <em style={{ color: C.text }}>"managed the acute visit well and chose the right antibiotic, I only helped with determining discharge readiness and clarified some discharge education."</em></span>
                <div style={{ marginTop: 8, fontWeight: 600, color: C.text }}>The implied feedback is that the trainee needs further development on discharge readiness and communication. That's not a problem; that's a growth opportunity sitting right inside an otherwise strong assessment.</div>
              </ExBox>
            </Exp>
            <Exp title="Sometimes the narrative comments will feel unhelpful.">
              <p style={{ margin: "0 0 10px" }}>Narrative quality is not universally high. Some comments will be vague, brief, or feel like they do not tell you anything useful. This is a known challenge, and faculty are actively developing their skills in providing specific, actionable feedback. For the most part, narrative comments in workplace-based assessment systems such as this one are more specific and actionable than what was typically written in end-of-rotation evaluations, but that does not mean every individual comment will feel useful to you.</p>
              <p style={{ margin: 0 }}>If you are worried about a comment or do not know how to interpret it, please reach out to either the individual who wrote it, a faculty coach, or a trusted member in your program to discuss it further.</p>
            </Exp>
            <Exp title="We encourage faculty to dictate quickly and not proofread.">
              <p style={{ margin: 0 }}>We want many low-stakes data points rather than a few polished ones. That means some comments may contain dictation artifacts or read less polished than you might expect. That is by design. A quick, timely observation captured in the moment is more valuable than a carefully edited paragraph completed days later or not at all.</p>
            </Exp>
            <Exp title="What to do if you have concerns about bias?">
              <p style={{ margin: "0 0 10px" }}>Bias exists in all assessment systems, and this one is no exception. We have built in several strategies to mitigate bias, including just-in-time teaching prompts that discourage personality-based labels, collecting many data points from diverse assessors, and providing transparency so you can see your own data. But these strategies reduce bias; they do not eliminate it.</p>
              <p style={{ margin: 0 }}>If you have concerns about bias in an individual assessment or based on patterns in your assessment data, please reach out to a trusted member of your program. Your voice helps us create stronger and more equitable systems. Raising concerns is not a complaint; it is a contribution to improving the system for everyone.</p>
            </Exp>
            <Exp title="Frequent feedback can feel like a lot.">
              <p style={{ margin: "0 0 10px" }}>We know that some residents love getting frequent feedback and for some it can feel overwhelming. Both reactions are completely understandable. This is a fundamentally different volume of feedback than what you may have experienced before, and it takes time to develop a relationship with that much data.</p>
              <p style={{ margin: 0 }}>Prior pilots and early data from this implementation suggest that both faculty and residents end up preferring this system over time. The first months are the adjustment period. Stick with it. And if it feels like too much, remember that you do not need to process every assessment in isolation. The dashboard exists precisely to help you see the patterns without getting lost in individual data points.</p>
            </Exp>
          </Tile>

          {/* TILE 3: PROGRESS */}
          <Tile icon={"\u{1F9ED}"} iconBg="#EDE8F5"
            title="Help you and your program assess where you are"
            summary="The same data helps you and your program accurately understand where you are on your trajectory toward performing the activities of a general pediatrician without supervision at the time of graduation."
            topics={["No single data point", "Patterns not snapshots", "Don't rely on averages", "Faculty learning scales"]}>
            <p style={{ fontFamily: sans, fontSize: 14.5, lineHeight: 1.75, color: C.text2, margin: "0 0 14px" }}>Your <Tip def="A group of faculty and educators responsible for monitoring your progress and making decisions about your supervision needs across all EPAs.">Clinical Competency Committee (CCC)</Tip> reviews your aggregate data: supervision ratings, narrative comments, clinical context, and patterns over time. The approach described in this guide (patterns over snapshots, narratives alongside ratings) is the same approach your program and CCC should be using.</p>
            <Exp title="No single data point carries too much weight.">
              <p style={{ margin: 0 }}>With many data points from diverse faculty across settings and time, no single assessment should significantly influence a CCC determination.</p>
            </Exp>
            <Exp title="Look for patterns, not snapshots.">
              <p style={{ margin: 0 }}>The graphs show you patterns over time. Look for growth, and also notice periods where growth may have plateaued or appears to have dropped. Normal growth is not always linear. We have good days and days that aren't our best. We go from rotations that we feel comfortable and strong in to rotations where we might need more help and support. This is all normal. A plateau might reflect your practice or a gap in the assessment data. If you see a plateau or dip, it's a great time to reflect: What's going on in this area? Do the narrative comments help me understand what I could work on? Can I use that information to build an action plan for myself?</p>
            </Exp>
            <Exp title="Don't rely on averages.">
              <p style={{ margin: 0 }}>Neither you nor your CCC should rely on numerical averages alone to determine supervision needs. Each supervision rating reflects a supervisor's retrospective judgment about how much supervision you needed for a specific past encounter. This is different from what you will need in a future practice setting outside a training environment. The supervision ratings, narrative comments, clinical context, sources of assessment, and patterns over time should all be interpreted together. No single number tells the story; the whole picture does.</p>
            </Exp>
            <Exp title="Faculty are still learning the scales.">
              <p style={{ margin: 0 }}>Faculty are still developing comfort with the supervision rating scales, and their numerical ratings may sometimes seem off to you or may not fully align with what they wrote in the narrative. This is a known challenge, especially early on, and it is one more reason why having more assessments helps. With a larger number of data points, individual rating inconsistencies matter much less, and the overall pattern becomes clearer for you and your program.</p>
            </Exp>
          </Tile>
        </div>

        {/* NOTE OF APPRECIATION */}
        <div style={{ marginTop: 24 }}>
          <Tile icon={"\u{1F4AC}"} iconBg="#EDE8F5" bg="#F3F0F8"
            title="A note to you from the team building this"
            summary="">
            <Exp title="Why we are building this.">
              <p style={{ margin: 0 }}>We are building this because we genuinely believe it will produce more meaningful feedback for you and more reliable data for the decisions that affect your training, and because we believe our assessment systems should be focused on the outcome that matters most: ensuring that new pediatricians can meet the needs of their patients. We are not building from scratch. We have the benefit of learning from other specialties and countries that have gone through this before us, and from the over 80 programs now using this platform together. We know from those experiences that the transition to a system like this is harder before it gets better, but it does get better. We are so appreciative of you because you are sitting in the hardest part. You are giving the feedback that makes this system better. You are helping shift the culture that needs to shift. That matters, and we do not take it for granted.</p>
            </Exp>
            <Exp title="We are working on it.">
              <p style={{ margin: 0 }}>We are actively working on faculty engagement. We are trying to rapidly build and improve the technology.</p>
            </Exp>
            <Exp title="Technology can move both fast and slow.">
              <p style={{ margin: 0 }}>We are learning that some changes can be made quickly and others take much longer than expected, and it is not always intuitive which changes fall into which category. Something that sounds simple from a user perspective may require significant engineering, coordination across programs, or depend on platform capabilities that are still being developed. We are prioritizing based on impact, feasibility, and alignment with the system's purpose, and the technology is advancing with each iteration.</p>
            </Exp>
            <Exp title="Every design decision involves tradeoffs.">
              <p style={{ margin: 0 }}>One of the tricky things about building a system like this is that it needs to be evidence-informed and work across many different programs and users. That means we cannot always optimize for one group without creating tradeoffs for another. When faculty tell us the forms take too long, and residents tell us the narrative feedback is not detailed enough, those are real tensions, and we are trying to be thoughtful about how we navigate them. Every design decision involves weighing what is best for residents, what is feasible for faculty, and what produces the most useful data for the decisions that ultimately matter for your training and your patients.</p>
            </Exp>
            <Exp title="We have made many changes based on feedback and will continue to.">
              <p style={{ margin: 0 }}>Many changes have already been made based on what we have heard from residents, faculty, and program leaders, and we will continue to make more. If you have made a suggestion and have not yet seen it reflected, it does not mean it was not heard.</p>
            </Exp>
            <Exp title="We know we will not get everything right.">
              <p style={{ margin: 0 }}>Built into this platform is the idea that we will need to learn and grow alongside you. We have not gotten everything right, and we will not. But we have committed to being transparent about the decisions we make, to learning from what happens when those decisions meet reality, and to revising when the evidence tells us we should. That is not a flaw in the system. It is how the system was designed to work.</p>
            </Exp>
            <Exp title="Thank you.">
              <p style={{ margin: 0 }}>Your willingness to engage with this system, even when it is imperfect, even when it is frustrating, is what makes it possible for it to get better. So thank you. And please keep telling us what is and is not working.</p>
            </Exp>
          </Tile>
        </div>
      </div>

      {/* FOOTER */}
      <div style={{ background: C.surface, borderTop: "1px solid " + C.border, marginTop: 36 }}>
