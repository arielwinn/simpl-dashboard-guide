<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABP/SIMPL | Your Assessment Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:#FAFAF8}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const C = {
  bg: "#FAFAF8", surface: "#FFFFFF", tint: "#F7F5F0", amber: "#9A7B2C",
  amberSub: "#FFF7E3", text: "#2D3039", text2: "#5A5E6B", border: "#E4E3DE",
  accent: "#C9A23D", green: "#2D6A4F", greenSub: "#E8F5E9",
};
const serif = "'Source Serif 4', Georgia, serif";
const sans = "'Source Sans 3', 'Segoe UI', sans-serif";

const SCALE = [
  { level: "1", title: "Supervisor Performed", color: "#E74C3C", short: "You observed", detail: "The supervisor performed the activity. You observed but were not yet ready to actively participate in leading the care." },
  { level: "2", title: "Supervisor Led", color: "#E67E22", short: "Supervisor directed most care", detail: "Required supervising physician(s) to direct the majority of the care. The supervisor led and you assisted or performed portions under close direction." },
  { level: "3", title: "Co-Led", color: "#F1C40F", short: "You and supervisor co-led", detail: "Required supervising physician(s) to direct some aspects of the care. You and your supervisor co-led, with the supervisor stepping in to guide specific elements." },
  { level: "4", title: "You Led", color: "#27AE60", short: "Only small adjustments needed", detail: "Resident directed care, supervision only led to small adjustments. You led the encounter and the supervisor's involvement was limited to minor refinements." },
  { level: "5", title: "Independent", color: "#2D6A4F", short: "Safe without a supervisor", detail: "Care would have been safe and effective without a supervisor. This does not mean you are done learning \u2014 it means for this encounter, you did not need someone overseeing the care." },
];

const CCC_SCALE = [
  { level: "1", title: "Observation Only", desc: "Supervisor performs. Trainee is not ready to actively participate." },
  { level: "2", title: "Supervisor Present", desc: "2A: Co-activity. 2B: Supervisor in room, ready to step in." },
  { level: "3", title: "Supervisor Available", desc: "3A: Close oversight. 3B: Moderate. Supervisor readily available but not always present." },
  { level: "4", title: "Limited Oversight", desc: "Supervisor still required but does not need to be readily available. NOT yet practice ready." },
  { level: "5", title: "Practice Ready", desc: "No supervisor required. Knows limits and seeks input when needed." },
];

/* ===== SMALL EXPANDABLE (for inside tiles) ===== */

function Exp({ title, children, open: defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div style={{ marginBottom: 5 }}>
      <button onClick={e => { e.stopPropagation(); setOpen(!open); }} style={{ display: "flex", alignItems: "flex-start", gap: 10, width: "100%", border: "1px solid " + (open ? C.border : "transparent"), background: open ? C.surface : "transparent", borderRadius: 8, padding: "11px 13px", cursor: "pointer", textAlign: "left", transition: "all .2s" }}
        onMouseEnter={e => { if (!open) { e.currentTarget.style.background = C.tint; e.currentTarget.style.borderColor = C.border; } }}
        onMouseLeave={e => { if (!open) { e.currentTarget.style.background = open ? C.surface : "transparent"; e.currentTarget.style.borderColor = open ? C.border : "transparent"; } }}>
        <span style={{ color: C.amber, fontSize: 11, fontWeight: 700, flexShrink: 0, marginTop: 4, transition: "transform .2s", transform: open ? "rotate(90deg)" : "rotate(0)", display: "inline-block" }}>{"\u25B8"}</span>
        <span style={{ fontFamily: serif, fontSize: 15, fontWeight: 700, color: C.text, lineHeight: 1.45 }}>{title}</span>
      </button>
      {open && <div style={{ padding: "4px 13px 10px 36px", color: C.text2, fontFamily: sans, fontSize: 14.5, lineHeight: 1.75 }}>{children}</div>}
    </div>
  );
}

function Tip({ children, def }) {
  const [show, setShow] = useState(false);
  return (
    <span style={{ position: "relative", display: "inline" }}>
      <span onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)} onClick={e => { e.stopPropagation(); setShow(!show); }}
        style={{ color: C.amber, fontWeight: 600, borderBottom: "1.5px dotted " + C.accent, cursor: "help" }}>{children}</span>
      {show && <span style={{ position: "absolute", bottom: "calc(100% + 10px)", left: "50%", transform: "translateX(-50%)", background: C.text, color: "#F0F0EE", padding: "12px 16px", borderRadius: 10, fontSize: 14, lineHeight: 1.55, width: 310, zIndex: 100, boxShadow: "0 8px 30px rgba(0,0,0,.15)", fontFamily: sans, fontWeight: 400 }}>
        {def}<span style={{ position: "absolute", top: "100%", left: "50%", transform: "translateX(-50%)", borderLeft: "7px solid transparent", borderRight: "7px solid transparent", borderTop: "7px solid " + C.text }} />
      </span>}
    </span>
  );
}

function LinkBtn({ href, children }) {
  return <a href={href} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} style={{
    display: "inline-flex", alignItems: "center", gap: 6, background: C.amberSub, border: "1px solid " + C.accent,
    borderRadius: 8, padding: "8px 14px", fontFamily: sans, fontSize: 13.5, fontWeight: 600, color: C.amber,
    textDecoration: "none", margin: "4px 6px 4px 0", cursor: "pointer",
  }}>{children} <span style={{ fontSize: 10 }}>{"\u2197"}</span></a>;
}

function ExBox({ children }) {
  return <div style={{ background: C.tint, borderRadius: 8, padding: "13px 14px", border: "1px solid " + C.border, fontSize: 14, lineHeight: 1.65, color: C.text2, margin: "10px 0" }}>
    <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: ".12em", color: C.amber, fontWeight: 700, marginBottom: 5, fontFamily: sans }}>Example</div>
    {children}
  </div>;
}

/* ===== BIG EXPANDABLE TILE ===== */

function Tile({ icon, iconBg, title, summary, open: startOpen, children, bg, topics }) {
  const [open, setOpen] = useState(startOpen || false);

  return (
    <div style={{ background: bg || C.surface, border: "1px solid " + (open ? C.accent : C.border), borderRadius: 14, transition: "border-color .2s, box-shadow .2s", boxShadow: open ? "0 4px 20px rgba(0,0,0,.05)" : "none" }}>
      <div style={{ padding: "10px 14px 8px", cursor: "pointer" }} onClick={() => setOpen(!open)}>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
          <div style={{ width: 36, height: 36, borderRadius: 9, background: iconBg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>{icon}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontFamily: serif, fontSize: 15.5, fontWeight: 700, color: C.text, marginBottom: 2, lineHeight: 1.3 }}>{title}</div>
            <div style={{ fontFamily: sans, fontSize: 13, color: C.text2, lineHeight: 1.5 }}>{summary}</div>
            {!open && topics && topics.length > 0 && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
                {topics.map((t, i) => (
                  <span key={i} style={{ fontFamily: sans, fontSize: 11, color: C.text2, background: C.tint, border: "1px solid " + C.border, borderRadius: 20, padding: "2px 8px", lineHeight: 1.3 }}>{t}</span>
                ))}
              </div>
            )}
          </div>
          <div style={{ fontFamily: sans, fontSize: 18, color: C.amber, flexShrink: 0, marginTop: 2, transition: "transform .25s", transform: open ? "rotate(90deg)" : "rotate(0)" }}>{"\u25B8"}</div>
        </div>
      </div>
      {open && <div style={{ padding: "0 14px 14px 60px", borderTop: "1px solid " + C.border }}>
        <div style={{ paddingTop: 10 }}>{children}</div>
      </div>}
    </div>
  );
}

/* ===== APP ===== */

function App() {
  const [selLevel, setSelLevel] = useState(null);

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>

      {/* LIVING DOC BANNER */}
      <div style={{ background: C.amberSub, borderBottom: "1px solid " + C.accent, padding: "4px 32px", textAlign: "center" }}>
        <p style={{ fontFamily: sans, fontSize: 11.5, color: C.amber, fontWeight: 600, lineHeight: 1.3, maxWidth: 700, margin: "0 auto" }}>This resource is a living document. We continue to update and improve it based on feedback.</p>
      </div>

      {/* HEADER */}
      <header style={{ background: C.surface, borderBottom: "1px solid " + C.border }}>
        <div style={{ maxWidth: 960, margin: "0 auto", padding: "10px 32px 8px", textAlign: "center" }}>
          <h1 style={{ fontFamily: serif, fontSize: 26, fontWeight: 800, color: C.text, margin: "0 0 2px", lineHeight: 1.2 }}>A Guide to Using Your Assessment Dashboard</h1>
          <p style={{ fontFamily: sans, fontSize: 13, color: C.text2, margin: 0, lineHeight: 1.4 }}>ABP/SIMPL Assessment Platform</p>

          {/* QUICK LINKS */}
          <div style={{ display: "flex", gap: 8, justifyContent: "center", margin: "0 auto 0" }}>
            <a href="https://drive.google.com/file/d/1w-3irvOs1rwrQn5ShRf7E7p4C75G2vk6/view?usp=sharing" target="_blank" rel="noopener" style={{ display: "inline-flex", alignItems: "center", gap: 6, background: C.amberSub, border: "1.5px solid " + C.accent, borderRadius: 10, padding: "8px 12px", textDecoration: "none", fontFamily: sans, fontSize: 13, fontWeight: 600, color: C.amber, textAlign: "center", lineHeight: 1.3 }}>
              {"\u{1F3AC}"} Video on How to Navigate the Dashboard
            </a>
            <a href="https://reports.simpl.org/" target="_blank" rel="noopener" style={{ display: "inline-flex", alignItems: "center", gap: 6, background: C.surface, border: "1.5px solid " + C.border, borderRadius: 10, padding: "8px 12px", textDecoration: "none", fontFamily: sans, fontSize: 13, fontWeight: 600, color: C.text, textAlign: "center", lineHeight: 1.3 }}>
              {"\u{1F4CA}"} Open Your Dashboard
            </a>
            <a href="https://platform.simpl.org/" target="_blank" rel="noopener" style={{ display: "inline-flex", alignItems: "center", gap: 6, background: C.surface, border: "1.5px solid " + C.border, borderRadius: 10, padding: "8px 12px", textDecoration: "none", fontFamily: sans, fontSize: 13, fontWeight: 600, color: C.text, textAlign: "center", lineHeight: 1.3 }}>
              {"\u{1F4DD}"} Create a Web Assessment
            </a>
          </div>
        </div>
      </header>

      {/* ===== CONTEXT + THREE TILES ===== */}
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "8px 32px 0" }}>

        {/* PLATFORM PURPOSE */}
        <div style={{ background: C.surface, border: "1px solid " + C.border, borderRadius: 14, padding: "14px 24px", marginBottom: 10 }}>
          <p style={{ fontFamily: serif, fontSize: 15, fontWeight: 700, color: C.text, lineHeight: 1.5, textAlign: "center", margin: "0 0 8px" }}>
            This platform and dashboard are built to ensure that at the time of graduation and certification, you are <em style={{ color: C.amber }}>practice ready</em>, able to provide safe and effective care as a general pediatrician.
          </p>
          <Exp title="What does practice ready mean?">
            <p style={{ margin: "0 0 14px", color: C.text2 }}>Pediatric residency prepares you to perform the essential activities of a general pediatrician (things like providing well-child care, managing acute illness, recognizing a severely ill child) safely and effectively in general pediatrics practice settings without someone assigned to direct or oversee your work. These essential activities are defined as Entrustable Professional Activities (EPAs), often referred to as "Everyday Pediatrician Activities," and being able to perform them without supervision is what we call <em>practice ready</em>.</p>
            <p style={{ margin: "0 0 14px", color: C.text2 }}>The expected outcome of training is to be practice ready across all of the General Pediatrics EPAs by the time of graduation. Beginning in 2028, program directors will need to attest to the American Board of Pediatrics, informed by assessment data, that you are practice ready in order to be eligible for board certification. This platform was built to generate that data, grounded in the EPAs and the practice ready construct, so that those decisions are evidence-informed and meaningful.</p>
            <p style={{ margin: "0 0 14px", color: C.text }}><strong>Practice ready does not mean expert, and it does not mean complete independence.</strong> <span style={{ color: C.text2 }}>Pediatrics is inherently collaborative, and every practicing pediatrician works within systems of consultation, referral, and team-based care. Practice ready means you can be trusted to perform these essential activities (i.e. the EPAs) without someone assigned to direct or oversee your work, not that you practice without ever needing input or support.</span></p>
            <p style={{ margin: 0, color: C.text }}><strong>You are not expected to be practice ready on day one of residency.</strong> <span style={{ color: C.text2 }}>It takes time to develop the skills and get the exposure needed to perform these activities. That's the point of training. Practice ready is a foundation, not a ceiling, that you may advance beyond for some EPAs during training, and this standard is the same for everyone. It does not change based on future job plans or plans to pursue fellowship. Readiness to be a general pediatrician is foundational for every pediatrician regardless of career path.</span></p>
          </Exp>
          <Exp title="How this platform helps you get there">
            <p style={{ margin: "0 0 10px", color: C.text2 }}>The ABP/SIMPL Assessment Platform is a workplace-based assessment tool designed to collect frequent, low-stakes feedback tied directly to clinical encounters. Each assessment form on the platform maps to one of the General Pediatrics EPAs. The platform serves a dual purpose: 1) to help you grow as a developing physician by providing actionable feedback you can use in real time, and 2) to help you and your program make accurate decisions about your progress toward practice readiness. Over time, these assessments build a picture of your development that serves both goals.</p>
            <p style={{ margin: 0, color: C.text2 }}>This dashboard makes you a partner in the process. It gives you a window into your own data and has two components: your assessment volume and your assessment data and patterns.</p>
          </Exp>
        </div>

        <div style={{ fontFamily: sans, fontSize: 11, fontWeight: 700, color: C.amber, textTransform: "uppercase", letterSpacing: ".1em", marginBottom: 8 }}>Your dashboard serves three purposes {"\u2014"} tap each to learn more</div>

        {/* THREE TILES */}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

          {/* TILE 1: VOLUME */}
          <Tile icon={"\u{1F4CA}"} iconBg={C.amberSub}
            title="Track your assessment volume"
            summary="See how many assessments you have, how they're distributed across EPAs, and where you may have gaps, so you can ensure you're getting sufficient data for an accurate picture."
            topics={["How many do I need?", "How do I get more?", "Pending assessments"]}>
            <Exp title="How many assessments do I need?">
              <p style={{ margin: 0 }}>We do not yet know how many assessments are needed to ensure your Clinical Competency Committee is making accurate and equitable decisions about your supervision needs, or how many are needed to give you a reliable sense of where you stand. What we do know is that the more assessments you have, the more accurate the picture becomes. This is by design: each individual assessment is meant to be low-stakes, just one small piece of a much bigger puzzle. The system works best when there are many pieces. Your program may have specific targets or implementation plans, so check with your program leadership about expectations.</p>
            </Exp>
            <Exp title="How do I get more assessments completed?">
              <p style={{ margin: "0 0 10px" }}>Different programs have different models for how assessments get initiated and completed, so follow your program's guidance on the expected workflow. If your program uses a model where you push assessments to faculty, the data show that the more you initiate, the more assessments you receive. The trade-off is that more pushes also may mean that more go uncompleted. Try not to let that discourage you. The completed ones still add up and move you forward.</p>
              <p style={{ margin: "0 0 10px" }}>Faculty are also figuring out new tools and workflows at the same time you are, and if assessments aren't being completed as expected, know that this is a learning curve for everyone and it gets easier with time.</p>
              <p style={{ margin: 0 }}>Please reach out to a leader of your program with specific concerns to see how they can help ensure your assessments are completed.</p>
            </Exp>
            <Exp title="Can I see which assessments are still pending or were not completed by faculty?">
              <p style={{ margin: 0 }}>We are actively developing visibility into your incomplete assessments (assessments that were initiated but not yet completed by faculty). This will allow you to track which assessments have been sent to faculty and which are still outstanding, giving you a fuller picture of your assessment activity and helping you follow up when needed. This will also help your program track faculty assessments and give them feedback about their engagement in the process of your development.</p>
            </Exp>
          </Tile>

          {/* TILE 2: GROWTH */}
          <Tile icon={"\u{1F331}"} iconBg={C.greenSub}
            title="Promote your growth toward practice readiness"
            summary="Your narrative comments are your richest source of feedback. These are where you'll find both areas of strength and areas where you can focus to take your performance to the next level."
            topics={["How do I use feedback to grow?", "No constructive feedback?", "Unhelpful comments", "Typos in comments", "Bias concerns", "Feeling overwhelmed"]}>
            <Exp title="How do I use my feedback to grow?">
              <p style={{ margin: 0 }}>The narrative comments in the system are not just feedback to read once and move on. They are the raw material for your learning and growth plans. At the level of an individual assessment, a comment can point you toward something specific to work on in your next encounter. But the real power comes from looking across your comments over time and noticing patterns: are multiple faculty noting the same area for growth? Is something that used to come up no longer appearing? Are there themes in what you do well that you can build on?</p>
            </Exp>
            <Exp title="Why do I feel like I am not getting any constructive feedback?">
              <p style={{ margin: "0 0 10px" }}>In this type of assessment system, developmental feedback isn't always obvious, as it frequently lacks a label of "area for improvement" or "deficiency." And that makes sense, because most often an area for growth does not represent a deficiency but rather expected developmental progression in training.</p>
              <ExBox>
                <span>For example, a faculty member might write that you <em style={{ color: C.text }}>"managed the acute visit well and chose the right antibiotic, I only helped with determining discharge readiness and clarified some discharge education."</em></span>
                <div style={{ marginTop: 8, fontWeight: 600, color: C.text }}>The implied feedback is that you need further development on discharge readiness and communication. That's not a problem; that's a growth opportunity embedded in an otherwise very positive assessment.</div>
              </ExBox>
            </Exp>
            <Exp title="What if a comment doesn't feel useful?">
              <p style={{ margin: "0 0 10px" }}>For the most part, narrative comments in workplace-based assessment systems such as this one are more specific and actionable than what was typically written in end-of-rotation evaluations, but that does not mean every individual comment will feel useful to you. Some comments will be vague, brief, or may not feel actionable. The forms themselves include just-in-time teaching prompts designed to help faculty strengthen narrative comments, and they are actively developing their skills in providing specific, actionable feedback.</p>
              <p style={{ margin: 0 }}>If you are worried about a comment or do not know how to interpret it, please reach out to either the individual who wrote it, a faculty coach, or a trusted member in your program to discuss it further.</p>
            </Exp>
            <Exp title="Why do comments sometimes have typos or odd phrasing?">
              <p style={{ margin: 0 }}>We want many low-stakes data points rather than a few polished ones. That means some comments may contain dictation artifacts or read less polished than you might expect. That is by design. A quick, authentic, and timely observation captured in the moment is more valuable than a carefully edited paragraph completed many days later or not at all.</p>
            </Exp>
            <Exp title="What should I do if I have concerns about bias in an assessment(s)?">
              <p style={{ margin: "0 0 10px" }}>We have built in several strategies to mitigate bias, including: just-in-time teaching prompts that discourage personality-based labels, collecting many data points from diverse assessors, and providing transparency so you can see your own data. But these strategies reduce bias; they do not fully eliminate it.</p>
              <p style={{ margin: 0 }}>If you have concerns about bias in an individual assessment or based on patterns in your assessment data, please reach out to a trusted member of your program. Your voice helps us create stronger and more equitable systems. Raising concerns is not a complaint; it is a contribution to improving the system for everyone.</p>
            </Exp>
            <Exp title="What if the volume of feedback feels overwhelming?">
              <p style={{ margin: "0 0 10px" }}>We know that some residents love getting frequent feedback and for some it can feel overwhelming. Both reactions are completely understandable. This is a fundamentally different volume of feedback than what you may have experienced before, and it takes time to develop a relationship with that much data.</p>
              <p style={{ margin: 0 }}>Prior pilots and early data from this implementation suggest that both faculty and residents prefer this system over time. The first months are the adjustment period. Stick with it, and if it feels like too much, remember that you do not need to process every assessment in isolation. The dashboard exists precisely to help you see the patterns without getting lost in individual data points.</p>
            </Exp>
          </Tile>

          {/* TILE 3: PROGRESS */}
          <Tile icon={"\u{1F9ED}"} iconBg="#EDE8F5"
            title="Help you and your program assess where you are"
            summary="The same data helps you and your program accurately understand where you are on your trajectory toward performing the activities of a general pediatrician without supervision at the time of graduation."
            topics={["More assessments = more accuracy", "How to interpret my data"]}>
            <p style={{ fontFamily: sans, fontSize: 14.5, lineHeight: 1.75, color: C.text2, margin: "0 0 14px" }}>Your <Tip def="A group of faculty and educators responsible for monitoring your progress and making decisions about your supervision needs across all EPAs.">Clinical Competency Committee (CCC)</Tip> reviews your aggregate data: supervision ratings, narrative comments, clinical context, and patterns over time. Your program may also use other sources of assessment data alongside this platform, and if so, that data will be integrated into the picture as well. Using all of this information, your CCC makes judgments about how much supervision you will need going forward, with the goal that you are practice ready to perform the EPAs by graduation. The approach described in this guide (patterns over snapshots, narratives alongside ratings) is the same approach your program and CCC should be using.</p>
            <Exp title="How does having more assessments improve the accuracy of my data?">
              <p style={{ margin: 0 }}>With many data points from diverse faculty across settings and time, no single assessment should significantly influence a CCC determination. More data produces a more accurate picture, and it also helps solve for the realities of a system that is still maturing. If a faculty member's rating seems miscalibrated because they are still learning the scales, that matters much less when it is one of many assessments. If you have concerns about the accuracy of a particular assessment, that is also less consequential when it sits within a larger body of evidence. The more assessments you accumulate, the more the overall pattern reflects your actual development and the less any individual data point can distort it.</p>
            </Exp>
            <Exp title="How should I interpret my data?">
              <p style={{ margin: "0 0 10px" }}>The graphs show you patterns over time. Look for growth, and also notice periods where growth may have plateaued or appears to have dropped. Normal growth is not always linear. We have good days and days that aren't our best. We go from rotations that we feel comfortable and strong in to rotations where we might need more help and support. This is all normal. A plateau might reflect your practice or a gap in the assessment data. If you see a plateau or dip, it's a great time to reflect: What's going on in this area? Do the narrative comments help me understand what I could work on? Can I use that information to build an action plan for myself?</p>
              <p style={{ margin: 0 }}>Neither you nor your CCC should rely on numerical averages alone to determine supervision needs. The data should be contextualized for trajectory and interpreted alongside narrative comments and other sources of assessment data. No single number tells the story; the whole picture does.</p>
            </Exp>
          </Tile>
        </div>

        {/* NOTE OF APPRECIATION */}
        <div style={{ marginTop: 12 }}>
          <Tile icon={"\u{1F4AC}"} iconBg="#EDE8F5" bg="#F3F0F8"
            title="A note to you from the team building this platform and leading this change"
            summary="">
            <p style={{ margin: "0 0 14px" }}>We are making this change because it should produce more meaningful feedback for you, more reliable data for the decisions that affect your training, and a system that is aligned to the outcome that matters most: ensuring that new pediatricians can meet the needs of their patients. We also recognize that early implementation is hard, even when a tool is designed intentionally with the input of many. We do not take that for granted.</p>
            <p style={{ margin: "0 0 14px" }}>We are not building from scratch. We have the benefit of learning from other specialties and countries that have gone through this transition already, and from the over 80 programs now using this platform together. We know from those experiences that transforming an assessment system in this manner is challenging. Many changes have already been made along the way during early implementation based on what we have heard from residents, faculty, and program leaders, and we will continue to adapt the system. We are grateful to everyone who has given us feedback that has led to real changes, including to this dashboard, which improved significantly based on resident input. Some changes happen quickly; others require significant engineering or coordination across programs and take longer than anyone expects. Every design decision involves tradeoffs between what is best for residents, what is feasible for faculty/programs, and what produces the most useful data, and we are trying to be thoughtful about how we navigate those tensions. Built into this platform is the idea that we will need to learn and grow alongside you. We are committed to being transparent about the decisions we make, to revising when the evidence tells us we should, and to listening to the people using the system every day. Thank you for your commitment as partners in improving your education and assessment as future pediatricians and pediatric subspecialists.</p>
          </Tile>
        </div>
      </div>

      {/* FOOTER */}
      <div style={{ background: C.surface, borderTop: "1px solid " + C.border, marginTop: 12 }}>
        <div style={{ maxWidth: 960, margin: "0 auto", padding: "12px 32px" }}>
          <div style={{ fontFamily: sans, fontSize: 11, fontWeight: 700, color: C.amber, textTransform: "uppercase", letterSpacing: ".1em", marginBottom: 10 }}>Questions or Concerns?</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
            <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
